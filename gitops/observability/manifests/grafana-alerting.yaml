apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting-togglemaster
  namespace: observability
  labels:
    grafana_alert: "1"
    project: togglemaster
data:
  contactpoints.yaml: |
    apiVersion: 1
    contactPoints:
      - orgId: 1
        name: togglemaster-incident-response
        receivers:
          - uid: togglemaster-pagerduty
            type: pagerduty
            settings:
              integrationKey: ${PAGERDUTY_ROUTING_KEY}
              severity: critical
              class: availability
              component: '{{ or .CommonLabels.service_name "auth-service" }}'
              summary: '{{ .CommonAnnotations.summary }}'
          - uid: togglemaster-self-healing-webhook
            type: webhook
            settings:
              url: http://self-healing-runbook.observability.svc.cluster.local:8080/webhook
              httpMethod: POST

  policies.yaml: |
    apiVersion: 1
    policies:
      - orgId: 1
        receiver: togglemaster-incident-response
        group_by: ['alertname', 'service_name']
        group_wait: 10s
        group_interval: 30s
        repeat_interval: 5m

  rules.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: ToggleMaster-Availability-Alerts
        folder: ToggleMaster
        interval: 10s
        rules:
          - uid: togglemaster_high_5xx_rate
            title: "ToggleMaster - Alta Taxa de Erros HTTP 5xx (> 5%)"
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 180
                  to: 0
                datasourceUid: prometheus
                model:
                  editorMode: code
                  expr: ((sum by (service_name) (rate(togglemaster_calls_total{span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[1m])) or 0 * sum by (service_name) (rate(togglemaster_calls_total{span_kind="SPAN_KIND_SERVER"}[1m]))) / clamp_min(sum by (service_name) (rate(togglemaster_calls_total{span_kind="SPAN_KIND_SERVER"}[1m])), 0.001)) * 100
                  intervalMs: 1000
                  maxDataPoints: 43200
                  range: true
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  reducer: last
                  settings:
                    mode: dropNN
                  type: reduce
                  refId: B
              - refId: C
                datasourceUid: __expr__
                model:
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: B
                  type: threshold
                  conditions:
                    - evaluator:
                        params:
                          - 5
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - C
                      reducer:
                        params: []
                        type: last
                  refId: C
            noDataState: OK
            execErrState: OK
            for: 10s
            annotations:
              summary: "Alta taxa de erros HTTP 5xx detectada em {{ $labels.service_name }} (> 5%)"
              description: "O servico {{ $labels.service_name }} ultrapassou o limite de 5% de erros HTTP 5xx. Acionando PagerDuty, ChatOps (Teams) e Self-Healing Runbook."
            labels:
              severity: critical
            isPaused: false
