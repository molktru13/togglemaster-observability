apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-togglemaster
  namespace: observability
  labels:
    grafana_dashboard: "1"
    project: togglemaster
data:
  togglemaster-observability.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 15
              }
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 9, "x": 0, "y": 0 },
          "id": 1,
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] },
            "tooltip": { "mode": "multi" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (namespace) (rate(container_cpu_usage_seconds_total{namespace=~\"togglemaster-.*|observability\", container!=\"\"}[5m]))",
              "legendFormat": "{{namespace}}",
              "refId": "A"
            }
          ],
          "title": "Uso de CPU por Namespace (Cores)",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 15
              }
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 9, "x": 9, "y": 0 },
          "id": 2,
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] },
            "tooltip": { "mode": "multi" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (namespace) (container_memory_working_set_bytes{namespace=~\"togglemaster-.*|observability\", container!=\"\"})",
              "legendFormat": "{{namespace}}",
              "refId": "A"
            }
          ],
          "title": "Uso de Memória por Namespace",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 5 }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 0 },
          "id": 3,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "center",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "count(kube_pod_status_phase{namespace=~\"togglemaster-.*\", phase=\"Running\"} == 1)",
              "legendFormat": "Pods Running",
              "refId": "A"
            }
          ],
          "title": "Pods Running (ToggleMaster)",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 12
              }
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 8 },
          "id": 4,
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "calcs": ["lastNotNull", "mean"] },
            "tooltip": { "mode": "multi" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (service_name) (rate(togglemaster_calls_total{span_kind=\"SPAN_KIND_SERVER\"}[2m]))",
              "legendFormat": "{{service_name}}",
              "refId": "A"
            }
          ],
          "title": "Taxa de Requisições por Microsserviço (req/s)",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 5 }
                ]
              },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 20,
                "thresholdsStyle": { "mode": "line" }
              }
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 8 },
          "id": 5,
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "calcs": ["lastNotNull", "max"] },
            "tooltip": { "mode": "multi" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "((sum by (service_name) (rate(togglemaster_calls_total{span_kind=\"SPAN_KIND_SERVER\", status_code=\"STATUS_CODE_ERROR\"}[2m])) or 0 * sum by (service_name) (rate(togglemaster_calls_total{span_kind=\"SPAN_KIND_SERVER\"}[2m]))) / clamp_min(sum by (service_name) (rate(togglemaster_calls_total{span_kind=\"SPAN_KIND_SERVER\"}[2m])), 0.001)) * 100",
              "legendFormat": "{{service_name}}",
              "refId": "A"
            }
          ],
          "title": "Taxa de Erros HTTP 5xx (%) — Gate 5%",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 12
              }
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 8 },
          "id": 6,
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "calcs": ["lastNotNull", "max"] },
            "tooltip": { "mode": "multi" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.95, sum by (le, service_name) (rate(togglemaster_duration_milliseconds_bucket{span_kind=\"SPAN_KIND_SERVER\"}[5m])))",
              "legendFormat": "{{service_name}}",
              "refId": "A"
            }
          ],
          "title": "Latência P95 por Microsserviço (ms)",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 16 },
          "id": 7,
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false,
            "showCommonLabels": false,
            "showLabels": true,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "{k8s_namespace_name=~\"togglemaster-.*|observability\"}",
              "refId": "A"
            }
          ],
          "title": "Logs em Tempo Real — Microsserviços & Self-Healing (Loki via OTel)",
          "type": "logs"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": ["togglemaster", "fase4", "opentelemetry"],
      "time": { "from": "now-30m", "to": "now" },
      "title": "ToggleMaster — Observabilidade Total (Fase 4)",
      "uid": "togglemaster-observability-fase4",
      "version": 1
    }
