mode: daemonset
fullnameOverride: otel-logs-agent

image:
  repository: otel/opentelemetry-collector-contrib

presets:
  logsCollection:
    enabled: true
    includeCollectorLogs: false
  kubernetesAttributes:
    enabled: true

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 250m
    memory: 256Mi

config:
  exporters:
    otlphttp:
      endpoint: "http://otel-collector.observability.svc.cluster.local:4318"
      tls:
        insecure: true

  service:
    pipelines:
      logs:
        receivers: [filelog]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [otlphttp]
      traces: null
      metrics: null
