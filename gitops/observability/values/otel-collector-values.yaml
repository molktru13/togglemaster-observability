mode: deployment
replicaCount: 1
fullnameOverride: otel-collector

image:
  repository: otel/opentelemetry-collector-contrib

extraEnvsFrom:
  - secretRef:
      name: observability-secrets

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP
  metrics:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    protocol: TCP

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: 500m
    memory: 512Mi

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    memory_limiter:
      check_interval: 1s
      limit_percentage: 75
      spike_limit_percentage: 15
    batch:
      send_batch_size: 512
      timeout: 5s

  connectors:
    datadog/connector:
      traces:
        ignore_resources:
          - "GET /health"
    spanmetrics:
      namespace: togglemaster
      metrics_flush_interval: 15s
      histogram:
        unit: ms
      dimensions:
        - name: http.request.method
        - name: http.method
        - name: http.response.status_code
        - name: http.status_code
        - name: http.route

  exporters:
    datadog:
      api:
        key: "${env:DD_API_KEY}"
        site: "${env:DD_SITE}"
    prometheus:
      endpoint: "0.0.0.0:8889"
    otlphttp/loki:
      endpoint: "http://loki.observability.svc.cluster.local:3100/otlp"
      tls:
        insecure: true

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [datadog/connector, spanmetrics, datadog]
      metrics/datadog:
        receivers: [datadog/connector]
        processors: [memory_limiter, batch]
        exporters: [datadog]
      metrics:
        receivers: [otlp, spanmetrics]
        processors: [memory_limiter, batch]
        exporters: [prometheus]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlphttp/loki]
