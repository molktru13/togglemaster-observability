apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auth-service
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/molktru13/togglemaster-observability.git
    targetRevision: main
    path: gitops/auth-service
  destination:
    server: https://kubernetes.default.svc
    namespace: togglemaster-auth
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
